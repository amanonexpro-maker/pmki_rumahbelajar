name: PMKI Production CI — Quality Gates & Drizzle DB Migrate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-and-migrate:
    name: Typecheck, Lint, Build & Drizzle Migrate (sin1 / ap-southeast-1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript strict typecheck
        run: npm run typecheck

      - name: Run ESLint check
        run: npm run lint

      - name: Apply forward-only Drizzle migrations to Supabase Cloud (DIRECT_URL 5432)
        if: github.ref == 'refs/heads/main' && env.DIRECT_URL != ''
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

